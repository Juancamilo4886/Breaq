<!DOCTYPE html>

<html lang="es">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>BREAQ - Inicio</title>


<link rel="stylesheet" href="dashboard.css">


</head>



<body>



<div class="app">



<section class="dashboard">





<!-- =====================================
     SALUDO
===================================== -->


<div class="saludo">


<h1>

Hola, <span id="nombreUsuario">amigo</span>

</h1>


<p>

Qué bueno verte hoy

</p>


</div>









<!-- =====================================
     MASCOTA
===================================== -->


<div class="zona-mascota">


<div class="circulo"></div>



<img

src="../imagenes/mascota_sonriente.png"

class="mascota"

alt="Mascota BREAQ"


>


</div>









<!-- =====================================
     ESTADO EMOCIONAL
===================================== -->


<div class="tarjeta estado">


<h2>

¿Cómo te sientes hoy?

</h2>




<div class="emociones">



<button onclick="seleccionarEstado(this)">

😊

</button>



<button onclick="seleccionarEstado(this)">

😌

</button>



<button onclick="seleccionarEstado(this)">

😴

</button>



<button onclick="seleccionarEstado(this)">

🌸

</button>



</div>


</div>









<!-- =====================================
     EQUILIBRIO DIGITAL
===================================== -->


<div class="tarjeta equilibrio">


<h2>

Tu equilibrio digital

</h2>




<div class="dato">


<span>

Tiempo conectado

</span>



<strong>

2h 30m

</strong>


</div>






<div class="dato">


<span>

Pausas realizadas

</span>



<strong>

4

</strong>


</div>



</div>









<!-- =====================================
     ACCIONES
===================================== -->


<div class="acciones">


<h2>

¿Qué quieres hacer?

</h2>







<!-- ACOMPAÑAMIENTO -->


<button

class="accion acompanamiento"

onclick="irAcompanamiento()"

>


<span class="icono">

+

</span>


<span>

Acompañamiento

</span>



</button>









<!-- PROCESO -->


<button

class="accion proceso"

onclick="irProceso()"

>


<span class="icono">

=

</span>


<span>

Mirar mi proceso

</span>



</button>





</div>







</section>



</div>







<script src="dashboard.js"></script>



</body>


</html>
