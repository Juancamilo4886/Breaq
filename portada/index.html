<!DOCTYPE html>

<html lang="es">


<head>


    <!-- =====================================
         CONFIGURACIÓN DE LA PORTADA BREAQ
         Adaptación para celular
    ====================================== -->


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <title>BREAQ</title>





    <!-- =====================================
         CONFIGURACIÓN PWA
         Permite instalar BREAQ
         como aplicación
    ====================================== -->


    <link rel="manifest" href="manifest.json">


    <meta name="theme-color" content="#aa3f74">






    <!-- =====================================
         CSS EXCLUSIVO DE PORTADA
    ====================================== -->


    <link rel="stylesheet" href="portada.css">





</head>







<body>







<!-- =====================================
     CONTENEDOR PRINCIPAL APP
===================================== -->


<div class="app">







<section class="portada">







    <!-- =====================================
         LOGO Y FRASE PRINCIPAL
    ====================================== -->


    <div class="logo">


        <h1>

            BREAQ

        </h1>





        <p>

            Tu compañero digital<br>

            para encontrar equilibrio

        </p>



    </div>












    <!-- =====================================
         ZONA DE MASCOTA

         Aquí viven:
         - círculo
         - estrellas
         - mascota

    ====================================== -->


    <div class="zona-mascota">





        <!-- Fondo circular -->


        <div class="circulo"></div>









        <!-- Estrellas -->


        <span class="estrella e1">✦</span>


        <span class="estrella e2">✦</span>


        <span class="estrella e3">✦</span>


        <span class="estrella e4">✦</span>


        <span class="estrella e5">✦</span>


        <span class="estrella e6">✦</span>









        <!-- Mascota principal -->


        <img


        src="../imagenes/mascota_principal.png"


        class="mascota"


        alt="Mascota BREAQ">


    </div>













    <!-- =====================================
         MENSAJE INFERIOR
    ====================================== -->


    <p class="mensaje">


        <i>

        Estoy aquí para acompañarte

        </i>


    </p>












    <!-- =====================================
         BOTÓN

         Conecta con modos.html

    ====================================== -->


    <button


    class="boton"


    onclick="irModos()"


    >


        Comenzar



    </button>







</section>







</div>









<!-- =====================================
     JAVASCRIPT EXCLUSIVO DE PORTADA
===================================== -->


<script src="portada.js"></script>









<!-- =====================================
     ACTIVACIÓN PWA

     Registra la aplicación
===================================== -->


<script>


if("serviceWorker" in navigator){


window.addEventListener(

"load",

function(){



navigator.serviceWorker.register(

"service-worker.js"


)

.then(function(){


console.log(

"BREAQ instalada como PWA"

);


})



.catch(function(error){


console.log(

"Error PWA:", error


);



});



}



);



}



</script>








</body>



</html>
