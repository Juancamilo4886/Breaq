<!DOCTYPE html>

<html lang="es">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>BREAQ - Acompañamiento</title>



<link rel="stylesheet" href="acompanamiento.css">


</head>



<body>


<div class="app">



<section class="acompanamiento">



<!-- TITULO -->


<h1>
Acompañamiento
</h1>





<!-- MASCOTA -->


<img

src="../imagenes/mascota_colmillos.png"

class="mascota"

alt="Mascota BREAQ"

>







<!-- ESTADO -->


<div class="estado">


<span id="punto">

○

</span>


<span id="textoEstado">

Inactivo

</span>


</div>







<!-- CONTADOR -->


<div class="contador">


<h2>

Tiempo conectado

</h2>



<p id="contador">

00:00

</p>



</div>







<!-- BOTON PRINCIPAL -->


<button

id="botonAccion"

onclick="activarAcompanamiento()"

>


Activar acompañamiento


</button>









<!-- BOTON VOLVER -->


<button

onclick="volver()"

class="botonSecundario"

>


Volver


</button>






</section>


</div>








<!-- 
 IMPORTANTE:

 Como usamos import/export
 debe ser module
-->


<script

type="module"

src="acompanamiento.js">

</script>



</body>


</html>
