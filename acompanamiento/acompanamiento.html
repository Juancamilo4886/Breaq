<!DOCTYPE html>

<html lang="es">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>BREAQ - Acompañamiento</title>


<link rel="stylesheet" href="acompanamiento.css">


</head>



<body>


<div class="app">


<section class="acompanamiento">



<!-- ===============================
     ENCABEZADO
================================ -->


<div class="header">


<button onclick="volver()">

‹

</button>



<div>

<h1>

Acompañamiento

</h1>


<p>

BREAQ estará contigo

</p>


</div>


</div>









<!-- ===============================
     MASCOTA
================================ -->


<div class="zona-mascota">


<div class="circulo"></div>



<img

src="../imagenes/mascota_sonriente.png"

class="mascota"

alt="Mascota BREAQ"

>


</div>









<!-- ===============================
     ESTADO
================================ -->


<div class="tarjeta">


<h2>

Estado del acompañamiento

</h2>




<div class="estado">


<span id="punto">

○

</span>



<span id="textoEstado">

Inactivo

</span>


</div>



</div>









<!-- ===============================
     TIEMPO
================================ -->


<div class="tarjeta">


<h2>

Tiempo acompañado

</h2>



<p

id="contador"

class="contador"

>

00:00

</p>



</div>









<!-- ===============================
     ACTIVAR
================================ -->


<button

id="botonAccion"

class="boton"

onclick="finalizar()"

>

Finalizar acompañamiento

</button>



</section>


</div>





<script type="module" src="acompanamiento.js"></script>


</body>


</html>
