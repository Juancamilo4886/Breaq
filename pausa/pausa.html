<!DOCTYPE html>

<html lang="es">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>BREAQ - Pausa</title>



<link rel="stylesheet" href="pausa.css">


</head>



<body>



<div class="app">



<section class="pausa">





<!-- =====================================
     TITULO
===================================== -->


<h1>

Momento de pausa

</h1>



<p class="subtitulo">

Regálate unos segundos para respirar

</p>









<!-- =====================================
     MASCOTA
===================================== -->


<div class="zona-mascota">


<div class="circulo"></div>



<img

src="../imagenes/conejito_dormido_con_sudadera_rosa.png"

class="mascota"

alt="Mascota descansando"

>


</div>









<!-- =====================================
     RESPIRACIÓN
===================================== -->


<div class="respiracion">



<h2 id="textoRespira">

Inhala

</h2>



<div class="respira-circulo"></div>




</div>









<!-- =====================================
     MENSAJE
===================================== -->


<p class="mensaje">


Sigue tu respiración.
No tienes que hacer nada más.


</p>








<!-- =====================================
     BOTÓN
===================================== -->


<button

onclick="terminarPausa()"

>

Continuar

</button>





</section>



</div>







<script src="pausa.js"></script>


</body>


</html>
