<!DOCTYPE html>

<html lang="es">


<head>


    <!-- =====================================
         CONFIGURACIÓN PANTALLA MODOS
    ====================================== -->


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>BREAQ - Modos</title>



    <!-- CSS exclusivo de esta pantalla -->

    <link rel="stylesheet" href="modos.css">


</head>



<body>



<div class="app">



<section class="modos">





    <!-- =====================================
         TITULO PRINCIPAL
    ====================================== -->


    <div class="encabezado">


        <h1>

            ¿Cómo quieres usar BREAQ?

        </h1>


        <p>

            Elige el modo que se adapta a ti

        </p>



    </div>









    <!-- =====================================
         TARJETA 1
         PAUSA RÁPIDA
    ====================================== -->


    <div class="tarjeta pausa"

    onclick="seleccionarModo('pausa')">



        <div class="texto">


            <h2>

                Pausa rápida

            </h2>



            <p>

                Te acompaña a tomar pausas
                cuando lo necesites

            </p>



        </div>





        <div class="lado-imagen">


            <img

            src="../imagenes/mascota_sonriente.png"

            class="mascota-modo"

            alt="Mascota feliz"

            >





            <!-- BOTÓN FLECHA 1 -->

            <button class="flecha">

                ›

            </button>



        </div>



    </div>












    <!-- =====================================
         TARJETA 2
         MOMENTO CONSCIENTE
    ====================================== -->


    <div class="tarjeta consciente"

    onclick="seleccionarModo('consciente')">





        <div class="texto">


            <h2>

                Momento consciente

            </h2>




            <p>

                Te ayuda a mantener
                el equilibrio en tu día

            </p>



        </div>








        <div class="lado-imagen">


            <img

            src="../imagenes/mascota_traviesa.png"

            class="mascota-modo"

            alt="Mascota traviesa"

            >





            <!-- BOTÓN FLECHA 2 -->

            <button class="flecha">

                ›

            </button>



        </div>





    </div>









</section>





</div>






<script src="modos.js"></script>


</body>


</html>
